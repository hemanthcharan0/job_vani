<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ibps-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="ibps-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#ibps-bg)" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>

  <!-- Geometric IBPS stylized monogram -->
  <!-- Circular arrows / progression rings -->
  <path d="M 50,16 A 34,34 0 0,1 84,50" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 84,50 A 34,34 0 0,1 50,84" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 50,84 A 34,34 0 0,1 16,50" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
  <path d="M 16,50 A 34,34 0 0,1 50,16" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner Disc -->
  <circle cx="50" cy="50" r="26" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Stylized IBPS text -->
  <text x="50" y="47" fill="#FFFFFF" font-size="11" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">IBPS</text>
  <text x="50" y="57" fill="#38BDF8" font-size="3" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">BANK EXAMS</text>
  <circle cx="50" cy="65" r="2.5" fill="#F59E0B"/>
</svg>
