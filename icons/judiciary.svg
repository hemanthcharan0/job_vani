<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="law-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="law-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#law-bg)" stroke="url(#law-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FEF08A" stroke-width="0.8" opacity="0.6"/>

  <!-- Ashoka Chakra (Dharma Wheel) in Background -->
  <circle cx="50" cy="42" r="18" fill="none" stroke="url(#law-gold)" stroke-width="1.8"/>
  <circle cx="50" cy="42" r="4" fill="url(#law-gold)"/>

  <!-- Scales of Justice (Tarazu) in Gold -->
  <!-- Top Balancer Beam -->
  <line x1="28" y1="36" x2="72" y2="36" stroke="url(#law-gold)" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Center Pivot / Post -->
  <line x1="50" y1="24" x2="50" y2="62" stroke="url(#law-gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="24" r="3" fill="url(#law-gold)"/>

  <!-- Left Scale Pan -->
  <line x1="28" y1="36" x2="22" y2="52" stroke="url(#law-gold)" stroke-width="1.2"/>
  <line x1="28" y1="36" x2="34" y2="52" stroke="url(#law-gold)" stroke-width="1.2"/>
  <path d="M 20,52 C 20,58 36,58 36,52 Z" fill="url(#law-gold)"/>

  <!-- Right Scale Pan -->
  <line x1="72" y1="36" x2="66" y2="52" stroke="url(#law-gold)" stroke-width="1.2"/>
  <line x1="72" y1="36" x2="78" y2="52" stroke="url(#law-gold)" stroke-width="1.2"/>
  <path d="M 64,52 C 64,58 80,58 80,52 Z" fill="url(#law-gold)"/>

  <!-- Pillar Base -->
  <rect x="38" y="62" width="24" height="4" rx="1" fill="url(#law-gold)"/>

  <!-- Motto / Badge -->
  <rect x="20" y="68" width="60" height="13" rx="2" fill="#0F172A" stroke="url(#law-gold)" stroke-width="1"/>
  <text x="50" y="77" fill="#FEF08A" font-size="6.5" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">JUDICIARY</text>

  <text x="50" y="88" fill="#FFFFFF" font-size="3.2" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" text-anchor="middle">यतो धर्मस्ततो जयः</text>
  <text x="50" y="93" fill="#94A3B8" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">SUPREME COURT / COURTS</text>
</svg>
