<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bhel-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="bhel-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Industrial Gear Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bhel-blue)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Cog Teeth around rim -->
  <g fill="#38BDF8">
    <rect x="47" y="4" width="6" height="6" rx="1"/>
    <rect x="47" y="90" width="6" height="6" rx="1"/>
    <rect x="4" y="47" width="6" height="6" rx="1"/>
    <rect x="90" y="47" width="6" height="6" rx="1"/>
    <rect x="18" y="18" width="6" height="6" rx="1" transform="rotate(45 21 21)"/>
    <rect x="76" y="18" width="6" height="6" rx="1" transform="rotate(45 79 21)"/>
    <rect x="18" y="76" width="6" height="6" rx="1" transform="rotate(45 21 79)"/>
    <rect x="76" y="76" width="6" height="6" rx="1" transform="rotate(45 79 79)"/>
  </g>

  <!-- Inner Gear Ring -->
  <circle cx="50" cy="50" r="37" fill="#0B1A3E" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Heavy Industry Dynamo / Electric Lightning Bolt -->
  <polygon points="56,18 36,48 48,48 42,76 66,42 52,42" fill="url(#bhel-bolt)" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- BHEL Bold Lettering -->
  <rect x="22" y="68" width="56" height="15" rx="3" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1"/>
  <text x="50" y="79" fill="#FFFFFF" font-size="9" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">BHEL</text>
  <text x="50" y="90" fill="#38BDF8" font-size="2.8" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">MAHARATNA PSU</text>
</svg>
