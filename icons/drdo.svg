<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="drdo-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="drdo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#drdo-bg)" stroke="url(#drdo-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.6"/>

  <!-- Radar / Electronics Radiation Rays in background -->
  <circle cx="50" cy="46" r="14" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2,2"/>
  <circle cx="50" cy="46" r="22" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>
  <circle cx="50" cy="46" r="30" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Tri-service: Flight Wings (Air Force) in Gold -->
  <g fill="url(#drdo-gold)">
    <path d="M 50,44 C 38,36 24,34 14,38 C 24,44 34,48 44,48 Z"/>
    <path d="M 50,44 C 62,36 76,34 86,38 C 76,44 66,48 56,48 Z"/>
  </g>

  <!-- Crossed Arrows / Swords (Army) -->
  <line x1="28" y1="28" x2="72" y2="64" stroke="url(#drdo-gold)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="72" y1="28" x2="28" y2="64" stroke="url(#drdo-gold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Naval Anchor (Navy) in Center -->
  <line x1="50" y1="30" x2="50" y2="58" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="50" cy="30" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 38,50 Q 50,62 62,50" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Central Atom / Research Nucleus -->
  <circle cx="50" cy="46" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- DRDO Banner -->
  <rect x="22" y="65" width="56" height="13" rx="2" fill="#0284C7" stroke="url(#drdo-gold)" stroke-width="1"/>
  <text x="50" y="74.5" fill="#FFFFFF" font-size="8" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">DRDO</text>

  <!-- Motto: बलस्य मूलं विज्ञानम् -->
  <text x="50" y="86" fill="#FEF08A" font-size="3.2" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" text-anchor="middle">बलस्य मूलं विज्ञानम्</text>
  <text x="50" y="92" fill="#94A3B8" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.5">DEFENCE R&amp;D</text>
</svg>
