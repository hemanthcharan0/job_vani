<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="post-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="post-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Red Rounded Rectangle Base -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="url(#post-red)" stroke="#FACC15" stroke-width="2"/>

  <!-- India Post Iconic Soaring Wing Shapes (Yellow) -->
  <!-- Top Main Wing -->
  <path d="M 22,72 C 34,70 56,56 78,24 C 68,36 50,46 36,52 Z" fill="url(#post-yellow)"/>

  <!-- Secondary Lower Wing -->
  <path d="M 26,76 C 40,74 58,62 72,40 C 62,50 48,58 36,62 Z" fill="url(#post-yellow)"/>

  <!-- Third Tail Feather -->
  <path d="M 30,80 C 42,78 54,70 64,54 C 56,62 46,68 36,70 Z" fill="url(#post-yellow)"/>

  <!-- Small Post Horn motif at bottom -->
  <circle cx="28" cy="74" r="4.5" fill="#FFFFFF"/>
  <circle cx="28" cy="74" r="2.5" fill="#DC2626"/>

  <!-- India Post Wordmark -->
  <text x="50" y="88" fill="#FFFFFF" font-size="5.2" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">भारतीय डाक</text>
  <text x="50" y="93" fill="#FEF08A" font-size="3.2" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.8">INDIA POST</text>
</svg>
