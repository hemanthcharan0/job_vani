<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="nabard-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <linearGradient id="nabard-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#nabard-green)" stroke="url(#nabard-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FEF08A" stroke-width="0.8" opacity="0.6"/>

  <!-- Wheat / Paddy Grains Stalk in Gold -->
  <g fill="url(#nabard-gold)" stroke="#78350F" stroke-width="0.4">
    <!-- Center stalk line -->
    <path d="M 50,66 C 50,45 50,22 50,18" fill="none" stroke="url(#nabard-gold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Top grain -->
    <path d="M 50,18 C 47,14 50,12 50,12 C 50,12 53,14 50,18 Z"/>
    <!-- Left grains -->
    <path d="M 49,24 C 42,20 40,24 45,28 C 48,29 49,27 49,24 Z"/>
    <path d="M 49,32 C 40,28 38,33 43,37 C 47,38 49,35 49,32 Z"/>
    <path d="M 49,41 C 38,37 36,43 42,47 C 46,48 49,44 49,41 Z"/>
    <path d="M 49,50 C 37,47 35,53 41,57 C 45,58 49,54 49,50 Z"/>
    <!-- Right grains -->
    <path d="M 51,24 C 58,20 60,24 55,28 C 52,29 51,27 51,24 Z"/>
    <path d="M 51,32 C 60,28 62,33 57,37 C 53,38 51,35 51,32 Z"/>
    <path d="M 51,41 C 62,37 64,43 58,47 C 54,48 51,44 51,41 Z"/>
    <path d="M 51,50 C 63,47 65,53 59,57 C 55,58 51,54 51,50 Z"/>
  </g>

  <!-- Green Sprouts at Base -->
  <path d="M 50,64 C 40,62 30,68 28,76 C 36,78 46,72 50,64 Z" fill="#34D399"/>
  <path d="M 50,64 C 60,62 70,68 72,76 C 64,78 54,72 50,64 Z" fill="#34D399"/>

  <!-- NABARD Badge -->
  <rect x="20" y="68" width="60" height="13" rx="2" fill="#064E3B" stroke="url(#nabard-gold)" stroke-width="1"/>
  <text x="50" y="77" fill="#FEF08A" font-size="7" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">NABARD</text>

  <text x="50" y="88" fill="#FFFFFF" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.3">AGRICULTURE &amp; RURAL</text>
</svg>
