<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="power-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <linearGradient id="power-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#power-bg)" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Turbine Blades Rotating -->
  <g fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 50,50 C 45,36 34,28 20,28"/>
    <path d="M 50,50 C 64,45 72,34 72,20"/>
    <path d="M 50,50 C 55,64 66,72 80,72"/>
    <path d="M 50,50 C 36,55 28,66 28,80"/>
  </g>

  <!-- High-Voltage Electric Lightning Bolt -->
  <polygon points="54,16 34,46 48,46 42,74 66,38 52,38" fill="url(#power-bolt)" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Central Energy Core -->
  <circle cx="50" cy="45" r="4" fill="#FEF08A"/>

  <!-- POWER / NTPC Badge -->
  <rect x="20" y="68" width="60" height="13" rx="2" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="50" y="77" fill="#FEF08A" font-size="6.5" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">POWER / NTPC</text>

  <text x="50" y="88" fill="#FFFFFF" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">ENERGY &amp; POWER CORP</text>
</svg>
