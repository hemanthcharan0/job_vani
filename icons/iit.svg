<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="iit-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="iit-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#iit-bg)" stroke="url(#iit-gold)" stroke-width="2.5"/>

  <!-- Mechanical Cog Wheel & Torch of Wisdom -->
  <circle cx="50" cy="46" r="22" fill="none" stroke="url(#iit-gold)" stroke-width="2.5"/>

  <!-- Cog Teeth -->
  <g fill="url(#iit-gold)">
    <rect x="47.5" y="21" width="5" height="5" rx="1"/>
    <rect x="47.5" y="66" width="5" height="5" rx="1"/>
    <rect x="25" y="43.5" width="5" height="5" rx="1"/>
    <rect x="70" y="43.5" width="5" height="5" rx="1"/>
  </g>

  <!-- Open Book & Torch of Technology -->
  <path d="M 50,28 L 50,56" stroke="url(#iit-gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flame atop torch -->
  <path d="M 50,18 C 46,22 46,26 50,28 C 54,26 54,22 50,18 Z" fill="#EF4444"/>

  <!-- Book Pages -->
  <path d="M 50,50 C 44,46 36,46 30,48 L 30,58 C 36,56 44,56 50,60 Z" fill="#FFFFFF"/>
  <path d="M 50,50 C 56,46 64,46 70,48 L 70,58 C 64,56 56,56 50,60 Z" fill="#FFFFFF"/>

  <!-- IIT Badge -->
  <rect x="22" y="68" width="56" height="13" rx="2" fill="#0C4A6E" stroke="url(#iit-gold)" stroke-width="1"/>
  <text x="50" y="77" fill="#FEF08A" font-size="8" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">I I T</text>
  <text x="50" y="89" fill="#FFFFFF" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">JEE ADVANCED / GATE</text>
</svg>
