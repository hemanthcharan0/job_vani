<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="brand-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3F8B"/>
      <stop offset="100%" stop-color="#0B1A3E"/>
    </radialGradient>
    <linearGradient id="brand-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#brand-grad)" stroke="url(#brand-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- Indian Tricolor Ring Band -->
  <path d="M 50,7 A 43,43 0 0,1 93,50" fill="none" stroke="#FF9933" stroke-width="3"/>
  <path d="M 93,50 A 43,43 0 0,1 50,93" fill="none" stroke="#138808" stroke-width="3"/>
  <path d="M 50,93 A 43,43 0 0,1 7,50" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 7,50 A 43,43 0 0,1 50,7" fill="none" stroke="#FF9933" stroke-width="3"/>

  <!-- Ashoka Chakra Spokes in subtle center -->
  <circle cx="50" cy="46" r="16" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.5"/>

  <!-- Government Portal Classical Pillars & Ashoka Crest -->
  <!-- Roof / Pediment -->
  <polygon points="50,20 22,33 78,33" fill="url(#brand-gold)"/>
  <rect x="24" y="33" width="52" height="3" rx="0.8" fill="#FEF08A"/>

  <!-- 4 Pillars -->
  <rect x="27" y="36" width="6" height="24" rx="1" fill="#FEF08A"/>
  <rect x="39" y="36" width="6" height="24" rx="1" fill="#FEF08A"/>
  <rect x="55" y="36" width="6" height="24" rx="1" fill="#FEF08A"/>
  <rect x="67" y="36" width="6" height="24" rx="1" fill="#FEF08A"/>

  <!-- Ashoka Chakra in Center between pillars -->
  <circle cx="50" cy="48" r="6" fill="#000080" stroke="url(#brand-gold)" stroke-width="1.2"/>
  <circle cx="50" cy="48" r="1.5" fill="#FEF08A"/>

  <!-- Base / Steps -->
  <rect x="20" y="60" width="60" height="4" rx="1" fill="#FEF08A"/>
  <rect x="16" y="64" width="68" height="4" rx="1" fill="url(#brand-gold)"/>

  <!-- JobVani Text at base -->
  <text x="50" y="78" fill="#FFFFFF" font-size="6" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">JOBVANI</text>
  <text x="50" y="87" fill="#FEF08A" font-size="3" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" text-anchor="middle">सरकारी पोर्टल</text>
</svg>
