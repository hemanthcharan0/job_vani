<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bank-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <linearGradient id="bank-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Outer circular seal -->
  <circle cx="50" cy="50" r="48" fill="url(#bank-bg)" stroke="url(#bank-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.6"/>

  <!-- Bank Facade & Columns with Rupee Symbol -->
  <!-- Pediment (Triangular roof) -->
  <polygon points="50,18 20,32 80,32" fill="url(#bank-gold)"/>
  <rect x="22" y="32" width="56" height="4" rx="1" fill="#FEF3C7"/>

  <!-- 4 Classical Pillars -->
  <rect x="25" y="36" width="7" height="30" rx="1" fill="#FEF3C7"/>
  <rect x="39" y="36" width="7" height="30" rx="1" fill="#FEF3C7"/>
  <rect x="54" y="36" width="7" height="30" rx="1" fill="#FEF3C7"/>
  <rect x="68" y="36" width="7" height="30" rx="1" fill="#FEF3C7"/>

  <!-- Golden Indian Rupee (₹) Symbol in Center -->
  <circle cx="50" cy="51" r="14" fill="#064E3B" stroke="url(#bank-gold)" stroke-width="1.8"/>
  <g fill="url(#bank-gold)">
    <!-- ₹ horizontal bars -->
    <rect x="43" y="44" width="14" height="2.2" rx="0.5"/>
    <rect x="43" y="48.5" width="14" height="2.2" rx="0.5"/>
    <!-- ₹ stem & curve -->
    <rect x="43" y="44" width="2.8" height="15" rx="0.5"/>
    <path d="M 45,45 H 51 C 55,45 55,51 51,51 H 45" fill="none" stroke="url(#bank-gold)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="47" y1="51" x2="55" y2="59" stroke="url(#bank-gold)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Base / Steps -->
  <rect x="18" y="66" width="64" height="5" rx="1" fill="#FEF3C7"/>
  <rect x="14" y="71" width="72" height="4" rx="1" fill="url(#bank-gold)"/>

  <!-- Bottom Text: BANKING & FINANCE -->
  <text x="50" y="85" fill="#FEF3C7" font-size="4.2" font-family="'Outfit', sans-serif" font-weight="800" text-anchor="middle" letter-spacing="1">BANKING / IBPS</text>
</svg>
