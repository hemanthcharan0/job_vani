<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="nta-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>
    <linearGradient id="nta-tri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#nta-bg)" stroke="#1E3A8A" stroke-width="2.5"/>

  <!-- NTA Dynamic Triangular Ribbon / Hexagon -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Saffron & Green dynamic ribbons -->
  <path d="M 50,20 L 76,35 L 50,50 Z" fill="#FF9933"/>
  <path d="M 50,50 L 76,65 L 50,80 Z" fill="#138808"/>
  <path d="M 50,20 L 24,35 L 50,50 Z" fill="#1E3A8A"/>
  <path d="M 50,50 L 24,65 L 50,80 Z" fill="#3B82F6"/>

  <!-- Inner Circle with NTA -->
  <circle cx="50" cy="50" r="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.8"/>
  <text x="50" y="54" fill="#1E3A8A" font-size="9" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="0.5">NTA</text>

  <!-- Subtitle -->
  <text x="50" y="90" fill="#1E3A8A" font-size="2.8" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">NATIONAL TESTING AGENCY</text>
</svg>
