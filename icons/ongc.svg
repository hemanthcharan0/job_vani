<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ongc-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <linearGradient id="ongc-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="80%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- ONGC Shield / Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#ongc-red)" stroke="#FACC15" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

  <!-- Golden Ring of Energy -->
  <circle cx="50" cy="46" r="22" fill="#991B1B" stroke="#FACC15" stroke-width="2"/>

  <!-- Iconic ONGC Flame Torch -->
  <!-- Outer Flame -->
  <path d="M 50,20 C 42,28 38,36 38,44 C 38,54 44,60 50,60 C 56,60 62,54 62,44 C 62,36 58,28 50,20 Z" fill="url(#ongc-flame)"/>
  <!-- Inner Flame Core -->
  <path d="M 50,30 C 45,36 43,40 43,46 C 43,51 46,55 50,55 C 54,55 57,51 57,46 C 57,40 55,36 50,30 Z" fill="#FEF08A"/>
  <!-- Small Center Spark -->
  <ellipse cx="50" cy="48" rx="2.5" ry="4" fill="#FFFFFF"/>

  <!-- Drill Rig / Offshore Platform Base silhouette -->
  <polygon points="40,60 60,60 56,66 44,66" fill="#FACC15"/>

  <!-- ONGC Lettering -->
  <rect x="22" y="68" width="56" height="15" rx="2" fill="#FFFFFF"/>
  <text x="50" y="79" fill="#991B1B" font-size="9" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">ongc</text>
  <text x="50" y="89" fill="#FEF08A" font-size="2.8" font-family="'Noto Sans Devanagari', sans-serif" font-weight="700" text-anchor="middle">ओ एन जी सी</text>
</svg>
