<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="isro-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="isro-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>

  <!-- Deep Space Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#isro-bg)" stroke="#F97316" stroke-width="2"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>

  <!-- Orbit Rings -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,3" transform="rotate(-25 50 50)"/>

  <!-- Satellite Solar Panels -->
  <!-- Left Panel -->
  <g fill="#0284C7" stroke="#38BDF8" stroke-width="0.8">
    <rect x="18" y="44" width="14" height="12" rx="1"/>
    <line x1="25" y1="44" x2="25" y2="56"/>
    <line x1="18" y1="50" x2="32" y2="50"/>
  </g>
  <!-- Right Panel -->
  <g fill="#0284C7" stroke="#38BDF8" stroke-width="0.8">
    <rect x="68" y="44" width="14" height="12" rx="1"/>
    <line x1="75" y1="44" x2="75" y2="56"/>
    <line x1="68" y1="50" x2="82" y2="50"/>
  </g>

  <!-- Upward Launch Vehicle Rocket (Iconic ISRO Orange Vector) -->
  <!-- Rocket Body -->
  <path d="M 50,14 C 47,24 45,36 45,54 L 55,54 C 55,36 53,24 50,14 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
  <!-- Nose cone -->
  <polygon points="50,14 47.5,23 52.5,23" fill="#EA580C"/>

  <!-- Booster Fins -->
  <polygon points="45,46 39,56 45,56" fill="#F97316"/>
  <polygon points="55,46 61,56 55,56" fill="#F97316"/>

  <!-- Rocket Exhaust Flame (Dynamic Orange / Yellow) -->
  <polygon points="46,55 54,55 50,72" fill="url(#isro-flame)"/>
  <polygon points="48,55 52,55 50,65" fill="#FEF08A"/>

  <!-- Satellite Bus Core -->
  <rect x="42" y="38" width="16" height="14" rx="2" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.2"/>
  <circle cx="50" cy="45" r="3.5" fill="#F97316"/>

  <!-- Official ISRO Lettering -->
  <text x="50" y="84" fill="#FFFFFF" font-size="9" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">isro</text>
  <text x="50" y="92" fill="#F97316" font-size="3" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.5">SPACE RESEARCH</text>
</svg>
