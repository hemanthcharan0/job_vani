<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="med-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <linearGradient id="med-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#med-bg)" stroke="#E0F2FE" stroke-width="2.5"/>

  <!-- Medical Cross in Background (Clean White) -->
  <path d="M 43,18 H 57 V 33 H 72 V 47 H 57 V 62 H 43 V 47 H 28 V 33 H 43 Z" fill="#FFFFFF" opacity="0.95"/>

  <!-- Rod of Asclepius with Entwined Serpent & Wings -->
  <!-- Golden Staff -->
  <line x1="50" y1="14" x2="50" y2="66" stroke="url(#med-gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="14" r="3.5" fill="url(#med-gold)"/>

  <!-- Entwined Green/Gold Healing Serpent -->
  <path d="M 46,20 Q 56,24 48,30 Q 42,36 53,40 Q 58,45 47,51 Q 43,56 50,62" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="46" cy="19" r="1.5" fill="#15803D"/>

  <!-- Ashoka Chakra Wheel Motif below staff -->
  <circle cx="50" cy="50" r="4" fill="none" stroke="#0369A1" stroke-width="1"/>

  <!-- Red Crescent / Shield banner -->
  <rect x="22" y="68" width="56" height="13" rx="2" fill="#BE123C" stroke="#FFFFFF" stroke-width="1"/>
  <text x="50" y="77" fill="#FFFFFF" font-size="7" font-family="'Outfit', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">AIIMS</text>

  <text x="50" y="88" fill="#FFFFFF" font-size="2.6" font-family="'Outfit', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.3">MEDICAL / HEALTH</text>
</svg>
