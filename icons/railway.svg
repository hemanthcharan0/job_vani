<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ir-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3F8B"/>
      <stop offset="100%" stop-color="#0B1A3E"/>
    </radialGradient>
    <linearGradient id="ir-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="ir-train" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Outer circular blue rim -->
  <circle cx="50" cy="50" r="48" fill="url(#ir-glow)" stroke="url(#ir-gold)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>

  <!-- 16 Stars in rim representing 16 railway zones -->
  <g fill="#FFDF73" id="ir-stars">
    <polygon points="50,4 51.2,7.5 54.5,7.5 51.8,9.5 52.8,13 50,10.8 47.2,13 48.2,9.5 45.5,7.5 48.8,7.5"/>
    <polygon points="67.5,7.5 68.2,11 71.5,11.5 68.7,13.2 69.4,16.8 66.8,14.5 64.2,16.5 65.1,13.2 62.5,11.3 66,11.1"/>
    <polygon points="82.5,17.5 82.5,21 86,22 83,23.5 83.3,27 81,24.5 78.5,26.5 79.5,23.2 77,21.5 80.5,21.2"/>
    <polygon points="92.5,32.5 92,36 95,37.5 92,39 92,42.5 90,40 87.2,41.8 88.5,38.5 86,36.5 89.5,36.5"/>
    <polygon points="95.5,50 94.5,53.5 97.5,55.2 94.2,56.5 94,60 92,57.5 89.2,59 90.5,55.8 88,54 91.5,53.8"/>
    <polygon points="92.5,67.5 91,70.8 94,72.5 90.8,73.5 90.2,77 88.5,74.2 85.5,75.5 87,72.5 84.8,70.5 88.2,70.5"/>
    <polygon points="82.5,82.5 80.5,85.5 83,87.5 79.8,88.2 78.8,91.5 77.5,88.5 74.5,89.5 76.2,86.8 74.2,84.5 77.8,84.8"/>
    <polygon points="67.5,92.5 65.2,95 67.2,97.5 64,97.8 62.8,101 61.8,98 58.8,98.5 60.8,96 59,93.5 62.5,94"/>
    <polygon points="50,96 48.8,92.5 45.5,92.5 48.2,90.5 47.2,87 50,89.2 52.8,87 51.8,90.5 54.5,92.5 51.2,92.5"/>
    <polygon points="32.5,92.5 31.8,89 28.5,88.5 31.3,86.8 30.6,83.2 33.2,85.5 35.8,83.5 34.9,86.8 37.5,88.7 34,88.9"/>
    <polygon points="17.5,82.5 17.5,79 14,78 17,76.5 16.7,73 19,75.5 21.5,73.5 20.5,76.8 23,78.5 19.5,78.8"/>
    <polygon points="7.5,67.5 8,64 5,62.5 8,61 8,57.5 10,60 12.8,58.2 11.5,61.5 14,63.5 10.5,63.5"/>
    <polygon points="4.5,50 5.5,46.5 2.5,44.8 5.8,43.5 6,40 8,42.5 10.8,41 9.5,44.2 12,46 8.5,46.2"/>
    <polygon points="7.5,32.5 9,29.2 6,27.5 9.2,26.5 9.8,23 11.5,25.8 14.5,24.5 13,27.5 15.2,29.5 11.8,29.5"/>
    <polygon points="17.5,17.5 19.5,14.5 17,12.5 20.2,11.8 21.2,8.5 22.5,11.5 25.5,10.5 23.8,13.2 25.8,15.5 22.2,15.2"/>
    <polygon points="32.5,7.5 34.8,5 32.8,2.5 36,2.2 37.2,-1 38.2,2 41.2,1.5 39.2,4 41,6.5 37.5,6"/>
  </g>

  <!-- Inner circle with track cog border -->
  <circle cx="50" cy="50" r="35" fill="#0E275C" stroke="url(#ir-gold)" stroke-width="1.8"/>

  <!-- Wheel Spokes / Track Rays in background -->
  <g stroke="rgba(255,223,115,0.25)" stroke-width="1.2">
    <line x1="50" y1="15" x2="50" y2="85"/>
    <line x1="15" y1="50" x2="85" y2="50"/>
    <line x1="25" y1="25" x2="75" y2="75"/>
    <line x1="25" y1="75" x2="75" y2="25"/>
  </g>

  <!-- Railway Tracks at bottom -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.5">
    <line x1="28" y1="80" x2="42" y2="68"/>
    <line x1="72" y1="80" x2="58" y2="68"/>
    <!-- Sleepers -->
    <line x1="30" y1="78" x2="70" y2="78" stroke-width="1.2"/>
    <line x1="34" y1="74" x2="66" y2="74" stroke-width="1.2"/>
    <line x1="38" y1="70" x2="62" y2="70" stroke-width="1.2"/>
  </g>

  <!-- Modern / Steam Locomotive Engine Icon (Front View) -->
  <!-- Cowcatcher (Pilot) -->
  <polygon points="34,74 66,74 62,67 38,67" fill="#C8A84B" stroke="#996515" stroke-width="0.8"/>
  <line x1="42" y1="67" x2="40" y2="74" stroke="#4A3B10" stroke-width="1"/>
  <line x1="47" y1="67" x2="46" y2="74" stroke="#4A3B10" stroke-width="1"/>
  <line x1="50" y1="67" x2="50" y2="74" stroke="#4A3B10" stroke-width="1"/>
  <line x1="53" y1="67" x2="54" y2="74" stroke="#4A3B10" stroke-width="1"/>
  <line x1="58" y1="67" x2="60" y2="74" stroke="#4A3B10" stroke-width="1"/>

  <!-- Train Buffer beam & Wheels -->
  <rect x="32" y="64" width="36" height="4" rx="1.5" fill="#991B1B"/>
  <circle cx="35" cy="66" r="2.2" fill="#D4AF37"/>
  <circle cx="65" cy="66" r="2.2" fill="#D4AF37"/>

  <!-- Train Body / Boiler -->
  <path d="M 33,64 L 33,42 Q 33,26 50,26 Q 67,26 67,42 L 67,64 Z" fill="url(#ir-train)" stroke="#0B1A3E" stroke-width="1.2"/>

  <!-- Locomotive Window / Windshield -->
  <rect x="37" y="32" width="11" height="9" rx="2" fill="#0B1A3E" stroke="#D4AF37" stroke-width="0.8"/>
  <rect x="52" y="32" width="11" height="9" rx="2" fill="#0B1A3E" stroke="#D4AF37" stroke-width="0.8"/>
  <path d="M 39,34 L 46,34 L 43,39 L 38,39 Z" fill="#38BDF8" opacity="0.6"/>
  <path d="M 54,34 L 61,34 L 58,39 L 53,39 Z" fill="#38BDF8" opacity="0.6"/>

  <!-- Indian Tricolor Stripe on Locomotive Front -->
  <rect x="33.5" y="44" width="33" height="3" fill="#FF9933"/>
  <rect x="33.5" y="47" width="33" height="3" fill="#FFFFFF"/>
  <rect x="33.5" y="50" width="33" height="3" fill="#138808"/>
  <!-- Central Ashoka chakra dot -->
  <circle cx="50" cy="48.5" r="1.3" fill="#000080"/>

  <!-- Front Headlight (Iconic Big Round Center Light) -->
  <circle cx="50" cy="57" r="5" fill="#D4AF37" stroke="#996515" stroke-width="0.8"/>
  <circle cx="50" cy="57" r="3.8" fill="#FFFBEB"/>
  <circle cx="50" cy="57" r="2.5" fill="#FDE047"/>

  <!-- Top Horns / Chimney -->
  <rect x="47.5" y="22" width="5" height="4" rx="1" fill="#C8A84B"/>
  <ellipse cx="50" cy="22" rx="3.5" ry="1.2" fill="#FFDF73"/>

  <!-- Small side marker lights -->
  <circle cx="36" cy="61" r="1.5" fill="#EF4444"/>
  <circle cx="64" cy="61" r="1.5" fill="#22C55E"/>
</svg>
